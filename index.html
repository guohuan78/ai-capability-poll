<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#3370FF">
  <meta name="robots" content="noindex">
  <title>AI 能力认知 · 现场统计</title>
  <link rel="stylesheet" href="styles.css?v=20261019-1454">
  <script src="config.js?v=20261019-1454" defer></script>
  <script src="poll.js?v=20261019-1454" defer></script>
  <script src="present.js?v=20261019-1454" defer></script>
</head>
<body class="present-page">
  <main class="present-shell">
    <header class="present-header">
      <div><div class="eyebrow"><span class="blue-square" aria-hidden="true"></span> AI 能力认知 · 现场统计</div>
        <h1 id="poll-title">现场投票：AI 已经能做好哪些任务？</h1>
        <p class="criterion" id="criterion">给定目标、资料与必要环境，AI 自主交付可用成果。</p>
      </div>
      <nav class="present-actions" aria-label="投票操作"><a href="vote.html" class="quiet-button">参与投票</a><button type="button" id="fullscreen-button" class="quiet-button">全屏展示</button></nav>
    </header>
    <div class="present-body">
      <section class="chart-panel" aria-label="投票统计">
        <div class="chart-topline"><span class="pill" id="poll-state">正在连接</span><span class="chart-label">人数 / 占参与人数比例</span></div>
        <div id="results" class="results-list" aria-busy="true"><p class="loading-note">正在读取现场统计…</p></div>
        <p class="chart-explanation">A–J 可多选，K / L 需单独选择 · 单项百分比 = 选择该项人数 ÷ 参与人数 · 各项比例之和可超过 100%</p>
      </section>
      <aside class="join-panel">
        <div class="respondent-count"><strong id="respondents">—</strong><span>人已参与</span></div>
        <div class="qr-frame" id="qr-frame"><img id="join-qr" src="qr.png?v=20261019-1454" alt="扫描二维码参与投票" width="280" height="280"><p id="qr-fallback" hidden>参与二维码准备中<br><a href="vote.html">点击打开投票页</a></p></div>
        <h2>扫码，说说你的判断</h2>
        <p class="join-tip">无需登录 · 匿名参与 · A–J 可多选</p>
        <a id="join-link" class="join-link" href="vote.html" target="_blank" rel="noopener">打开投票页</a>
        <button type="button" id="copy-link" class="quiet-button copy-button">复制参与链接</button>
      </aside>
    </div>
    <footer class="present-footer"><div class="connection" id="connection" role="status" aria-live="polite"><span class="connection-dot" aria-hidden="true"></span><span id="connection-text">正在连接投票服务…</span></div><span id="update-time">每 2 秒同步</span></footer>
  </main>
</body>
</html>
